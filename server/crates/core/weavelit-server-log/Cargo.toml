[package]
name = "weavelit-server-log"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

# The capability key is deliberately not reexported, so an ordinary Log Module
# cannot reach it through this crate.
[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
weavelit-server-log-authority = { path = "../weavelit-server-log-authority" }