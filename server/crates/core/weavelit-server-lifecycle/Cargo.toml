[package]
name = "weavelit-server-lifecycle"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
base64 = { version = "=0.23.0", default-features = false, features = ["alloc"] }
# Preserve the audited unyanked 0.10.2 resolution for detached no-lockfile fixtures.
chacha20.workspace = true
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = { version = "=0.4.3", default-features = false }
rustix.workspace = true
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
weavelit-server-database = { path = "../../database/weavelit-server-database" }
weavelit-server-database-authority = { path = "../../database/weavelit-server-database-authority" }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
tempfile = "=3.27.0"
weavelit-server-database-sqlite = { path = "../../database/weavelit-server-database-sqlite" }