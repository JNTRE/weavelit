[package]
name = "weavelit-server"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "weavelit-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
http-body-util = "=0.1.4"
httparse = "=1.10.1"
rustls = { version = "=0.23.43", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustix.workspace = true
tokio.workspace = true
tokio-rustls = { version = "=0.26.4", default-features = false }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
weavelit-server-database-sqlite = { path = "../../database/weavelit-server-database-sqlite" }
weavelit-server-lifecycle = { path = "../weavelit-server-lifecycle" }
weavelit-server-log = { path = "../weavelit-server-log" }
weavelit-module-client-webui = { path = "../../modules/client/weavelit-module-client-webui" }
weavelit-module-log-sqlite = { path = "../../modules/log/weavelit-module-log-sqlite" }

[dev-dependencies]
rcgen = "=0.14.8"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["test-util"] }