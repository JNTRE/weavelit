[package]
name = "weavelit-module-client"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum.workspace = true
base64 = { version = "=0.23.0", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
weavelit-server-lifecycle = { path = "../../../core/weavelit-server-lifecycle" }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
tokio.workspace = true
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
# The denial contract must be proved against every real denial cause the
# evaluator produces, not against a restatement of them, so the tests drive the
# evaluator itself. It stays a development dependency because rendering a
# denial requires no evaluator type.
weavelit-server-authorization = { path = "../../../core/weavelit-server-authorization" }
weavelit-server-database = { path = "../../../database/weavelit-server-database" }
