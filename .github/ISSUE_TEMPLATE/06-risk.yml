name: Risk
description: Record an uncertainty that needs monitoring or mitigation.
type: Risk
body:
  - type: markdown
    attributes:
      value: |
        Use a descriptive title without a "Risk:" prefix. After creation, add the relevant component labels, Priority value, milestone, and parent epic when applicable.
  - type: textarea
    id: risk
    attributes:
      label: Outcome
      description: State the uncertainty, the event that could occur, and why it matters.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Identify the conditions, indicators, assumptions, and evidence that would show this risk is materializing.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the potentially affected products, modules, interfaces, operations, and explicit exclusions.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List the observable conditions that demonstrate the risk has been mitigated, accepted, closed, or reduced.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: test-evidence
    attributes:
      label: Test Evidence
      description: State the validation, monitoring evidence, or other proof that supports the risk response.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link blocking decisions, related issues, or external constraints. Write "None" when there are none.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link the canonical documents, evidence, or related issues that define this risk. Write "None" when there are no references.
      value: |
        -
    validations:
      required: true