name: Bug
description: Report unexpected behavior with a reproducible path and expected result.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Use a descriptive title without a "Bug:" prefix. After creation, add the relevant component labels, Priority value, milestone, and parent epic when applicable.
  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: State the expected behavior, affected environment, reproduction steps, and relevant evidence. Redact secrets.
      value: |
        Expected behavior:

        Reproduction steps:
        1.
        2.
        3.

        Environment and evidence:
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the affected packages, modules, interfaces, and important exclusions.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List the observable conditions that demonstrate the defect is resolved.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: test-evidence
    attributes:
      label: Test Evidence
      description: State the regression test or other evidence that demonstrates the defect is fixed and remains fixed.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link blocking decisions, related issues, or external constraints. Write "None" when there are none.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link the canonical documents, relevant logs, or related issues. Write "None" when there are no references.
      value: |
        -
    validations:
      required: true