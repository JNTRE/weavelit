name: Bug
description: Report unexpected behavior with a reproducible path and expected result.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Use a descriptive title without a "Bug:" prefix. After creation, add the relevant component labels, Priority value, milestone, and parent epic when applicable.
  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: State the intended behavior or contractual expectation.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that demonstrates the problem.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Include relevant versions, configuration, logs, screenshots, or other evidence. Redact secrets.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Regression validation
      description: State the test or other evidence that will demonstrate the defect is fixed and remains fixed.
    validations:
      required: true