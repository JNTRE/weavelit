name: Task
description: Define a specific piece of implementation or maintenance work.
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Use a descriptive title without a "Task:" prefix. After creation, add the relevant component labels, Priority value, milestone, and parent epic.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the concrete result this work must produce.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the affected packages, modules, interfaces, and important exclusions.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List the observable conditions that must hold when the task is complete.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: test-evidence
    attributes:
      label: Test Evidence
      description: List the focused automated checks and any necessary manual verification.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link blocking decisions, related issues, or external constraints. Write "None" when there are none.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link the canonical documents, roadmap outcomes, or related issues that define this task. Write "None" when there are no references.
      value: |
        -
    validations:
      required: true