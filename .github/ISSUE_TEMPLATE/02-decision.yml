name: Decision
description: Resolve a bounded question with a documented conclusion.
type: Decision
body:
  - type: markdown
    attributes:
      value: |
        Use a descriptive title without a "Decision:" prefix. After creation, add the relevant component labels, Priority value, milestone, and parent epic.
  - type: textarea
    id: decision
    attributes:
      label: Decision Needed
      description: State the bounded question and the decision that this issue must produce.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Identify the relevant product, technical, security, operational, or compatibility constraints.
    validations:
      required: true
  - type: textarea
    id: decision-scope
    attributes:
      label: Decision Scope
      description: List the decisions, constraints, options, and tradeoffs that must be resolved. Identify what is out of scope when relevant.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List the observable conditions that demonstrate this decision is complete and recorded.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link the canonical documents, roadmap outcomes, or related issues needed to make this decision. Write "None" when there are no references.
      value: |
        -
    validations:
      required: true