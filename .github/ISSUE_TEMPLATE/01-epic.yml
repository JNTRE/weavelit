name: Epic
description: Define a cohesive outcome that organizes related issues.
type: Epic
body:
  - type: markdown
    attributes:
      value: |
        Use a descriptive title without an "Epic:" prefix. After creation, add the relevant component labels, Priority value, milestone, and child issues.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the user, operational, or architectural outcome this epic delivers.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the decisions, work, or boundaries that belong in this epic.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: completion-criteria
    attributes:
      label: Completion Criteria
      description: List the observable conditions that must hold before this epic can close.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out Of Scope
      description: List work that is intentionally excluded from this epic. Write "None" when there are no exclusions.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link the canonical documents, roadmap outcomes, or related issues that define this epic. Write "None" when there are no references.
      value: |
        -
    validations:
      required: true