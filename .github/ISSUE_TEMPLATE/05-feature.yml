name: Feature
description: Propose new functionality with clear scope and acceptance criteria.
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Use a descriptive title without a "Feature:" prefix. After creation, add the relevant component labels, Priority value, milestone, and parent epic.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Describe the capability and why it is needed.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain the user, operational, architectural, or product need that motivates this feature.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List expected behavior, affected interfaces, and explicit non-goals.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List the observable conditions that must hold for the feature to be complete.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: test-evidence
    attributes:
      label: Test Evidence
      description: List the focused automated checks and any necessary manual verification.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link blocking decisions, related issues, or external constraints. Write "None" when there are none.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link the canonical documents, roadmap outcomes, or related issues that define this feature. Write "None" when there are no references.
      value: |
        -
    validations:
      required: true