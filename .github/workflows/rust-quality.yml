name: Rust Quality

"on":
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read

jobs:
  quality:
    if: github.event.pull_request.draft == false
    name: Format, lint, test, and build
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: server/web-ui/.node-version
          cache: npm
          cache-dependency-path: server/web-ui/package-lock.json
      - name: Show selected Node toolchain
        run: |
          node --version
          npm --version
      - name: Install Playwright Chromium and its system dependencies
        # `make check` reinstalls the same cached Chromium build; this step adds
        # the root-level Ubuntu packages the browser needs, which the gate cannot
        # install itself.
        run: |
          playwright_version="$(node -e "process.stdout.write(require('./web-ui/package.json').devDependencies['@playwright/test'])")"
          npx --yes "@playwright/test@${playwright_version}" install --with-deps chromium
      - name: Install pinned Rust toolchain
        # Keep this version synchronized with server/rust-toolchain.toml for deterministic CI.
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt
      - name: Show selected Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version
      - name: Run quality gates
        run: make check